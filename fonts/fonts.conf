<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Config mínima de fontconfig para que sharp/librsvg use las fuentes de
     esta carpeta al rasterizar el ticket, sin instalar nada en el sistema.
     Se activa vía FONTCONFIG_PATH (ver ticket.image.service.ts). -->
<fontconfig>
  <dir prefix="relative">.</dir>
  <cachedir prefix="relative">.cache</cachedir>
</fontconfig>
